<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Product Price Comparison</h1>
  </header>

  <main>
    <div class="container">
      <form id="comparison-form">
        <label for="product-name">Product Name:</label>
        <input type="text" id="product-name" name="product-name" placeholder="Enter product name" required>
        <button type="submit">Compare Prices</button>
      </form>

      <div id="comparison-results" class="comparison-results">
        <!-- Comparison results will be dynamically added here -->
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Price Comparison Inc. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
